[project]
name = "grounded-legal-agent"
version = "0.1.0"
description = "A reference architecture for safely grounding an LLM agent in real case law — traced, evaluated, and self-improving (Gemini + Google ADK + Arize Phoenix)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Gemini agent runtime (code-owned)
    "google-adk>=1.32.0",
    "google-genai>=1.9.0",
    # OpenInference auto-instrumentation -> Phoenix
    "openinference-instrumentation-google-adk>=0.1.11",
    "arize-phoenix>=7.0",
    "arize-phoenix-evals>=0.17",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    # HTTP API so any client can call the agent
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "python-dotenv>=1.0.1",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
